# =====================================================================================
# POLYGLOT DISTRIBUTED MOVIE STREAMING — local free stack
# =====================================================================================
# Postgres  : users (P/R) + movie shards US/EU (P/R each)     — relational
# MongoDB   : watchlist (2 app-shards) + reviews (2 app-shards) — document
# Redis     : catalog cache + Streams event bus (Kafka stand-in)
# Services  : gateway :4000 + user/catalog/watchlist/review/recommendation/analytics
# =====================================================================================

services:

  user-db-master:
    image: bitnamilegacy/postgresql:16
    container_name: user-db-master
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pass
      POSTGRESQL_USERNAME: app
      POSTGRESQL_PASSWORD: app_pass
      POSTGRESQL_DATABASE: user_db
    ports: ["5401:5432"]
    volumes:
      - user_master_data:/bitnami/postgresql
      - ./sql/user_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [ddbnet]

  user-db-replica:
    image: bitnamilegacy/postgresql:16
    container_name: user-db-replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pass
      POSTGRESQL_MASTER_HOST: user-db-master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_PASSWORD: app_pass
    ports: ["5402:5432"]
    depends_on: [user-db-master]
    networks: [ddbnet]

  movie-shard-us-master:
    image: bitnamilegacy/postgresql:16
    container_name: movie-shard-us-master
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pass
      POSTGRESQL_USERNAME: app
      POSTGRESQL_PASSWORD: app_pass
      POSTGRESQL_DATABASE: movie_db
    ports: ["5411:5432"]
    volumes:
      - movie_us_master_data:/bitnami/postgresql
      - ./sql/movie_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [ddbnet]

  movie-shard-us-replica:
    image: bitnamilegacy/postgresql:16
    container_name: movie-shard-us-replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pass
      POSTGRESQL_MASTER_HOST: movie-shard-us-master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_PASSWORD: app_pass
    ports: ["5412:5432"]
    depends_on: [movie-shard-us-master]
    networks: [ddbnet]

  movie-shard-eu-master:
    image: bitnamilegacy/postgresql:16
    container_name: movie-shard-eu-master
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pass
      POSTGRESQL_USERNAME: app
      POSTGRESQL_PASSWORD: app_pass
      POSTGRESQL_DATABASE: movie_db
    ports: ["5421:5432"]
    volumes:
      - movie_eu_master_data:/bitnami/postgresql
      - ./sql/movie_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [ddbnet]

  movie-shard-eu-replica:
    image: bitnamilegacy/postgresql:16
    container_name: movie-shard-eu-replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_pass
      POSTGRESQL_MASTER_HOST: movie-shard-eu-master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_PASSWORD: app_pass
    ports: ["5422:5432"]
    depends_on: [movie-shard-eu-master]
    networks: [ddbnet]

  watchlist-mongo-1:
    image: mongo:7
    container_name: watchlist-mongo-1
    ports: ["27017:27017"]
    volumes: [watchlist_mongo1_data:/data/db]
    networks: [ddbnet]

  watchlist-mongo-2:
    image: mongo:7
    container_name: watchlist-mongo-2
    ports: ["27018:27017"]
    volumes: [watchlist_mongo2_data:/data/db]
    networks: [ddbnet]

  review-mongo-1:
    image: mongo:7
    container_name: review-mongo-1
    ports: ["27019:27017"]
    volumes: [review_mongo1_data:/data/db]
    networks: [ddbnet]

  review-mongo-2:
    image: mongo:7
    container_name: review-mongo-2
    ports: ["27020:27017"]
    volumes: [review_mongo2_data:/data/db]
    networks: [ddbnet]

  redis:
    image: redis:7-alpine
    container_name: ddb-redis
    ports: ["6379:6379"]
    networks: [ddbnet]

  user-service:
    build: .
    container_name: ddb-user-service
    command: ["node", "services/user-service/index.js"]
    env_file: .env
    environment: &svc-env
      USER_DB_MASTER_HOST: user-db-master
      USER_DB_MASTER_PORT: "5432"
      USER_DB_REPLICA_HOST: user-db-replica
      USER_DB_REPLICA_PORT: "5432"
      MOVIE_SHARD0_MASTER_HOST: movie-shard-us-master
      MOVIE_SHARD0_MASTER_PORT: "5432"
      MOVIE_SHARD0_REPLICA_HOST: movie-shard-us-replica
      MOVIE_SHARD0_REPLICA_PORT: "5432"
      MOVIE_SHARD1_MASTER_HOST: movie-shard-eu-master
      MOVIE_SHARD1_MASTER_PORT: "5432"
      MOVIE_SHARD1_REPLICA_HOST: movie-shard-eu-replica
      MOVIE_SHARD1_REPLICA_PORT: "5432"
      WATCHLIST_MONGO0_URI: mongodb://watchlist-mongo-1:27017/watchlist
      WATCHLIST_MONGO1_URI: mongodb://watchlist-mongo-2:27017/watchlist
      REVIEW_MONGO0_URI: mongodb://review-mongo-1:27017/reviews
      REVIEW_MONGO1_URI: mongodb://review-mongo-2:27017/reviews
      REDIS_URL: redis://redis:6379
      USER_SERVICE_URL: http://user-service:4001
      CATALOG_SERVICE_URL: http://catalog-service:4002
      WATCHLIST_SERVICE_URL: http://watchlist-service:4003
      REVIEW_SERVICE_URL: http://review-service:4004
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:4005
      ANALYTICS_SERVICE_URL: http://analytics-service:4006
    depends_on: [user-db-master, user-db-replica]
    networks: [ddbnet]

  catalog-service:
    build: .
    container_name: ddb-catalog-service
    command: ["node", "services/catalog-service/index.js"]
    env_file: .env
    environment:
      <<: *svc-env
    depends_on: [movie-shard-us-master, movie-shard-eu-master, redis]
    networks: [ddbnet]

  watchlist-service:
    build: .
    container_name: ddb-watchlist-service
    command: ["node", "services/watchlist-service/index.js"]
    env_file: .env
    environment:
      <<: *svc-env
    depends_on: [watchlist-mongo-1, watchlist-mongo-2]
    networks: [ddbnet]

  review-service:
    build: .
    container_name: ddb-review-service
    command: ["node", "services/review-service/index.js"]
    env_file: .env
    environment:
      <<: *svc-env
    depends_on: [review-mongo-1, review-mongo-2, redis, movie-shard-us-master, movie-shard-eu-master]
    networks: [ddbnet]

  recommendation-service:
    build: .
    container_name: ddb-recommendation-service
    command: ["node", "services/recommendation-service/index.js"]
    env_file: .env
    environment:
      <<: *svc-env
    depends_on: [watchlist-mongo-1, review-mongo-1, movie-shard-us-master]
    networks: [ddbnet]

  analytics-service:
    build: .
    container_name: ddb-analytics-service
    command: ["node", "services/analytics-service/index.js"]
    env_file: .env
    environment:
      <<: *svc-env
    depends_on: [redis, review-mongo-1, review-mongo-2]
    networks: [ddbnet]

  gateway:
    build: .
    container_name: ddb-api
    command: ["node", "services/gateway/index.js"]
    env_file: .env
    environment:
      <<: *svc-env
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on:
      - user-service
      - catalog-service
      - watchlist-service
      - review-service
      - recommendation-service
      - analytics-service
    networks: [ddbnet]

networks:
  ddbnet:
    driver: bridge

volumes:
  user_master_data:
  movie_us_master_data:
  movie_eu_master_data:
  watchlist_mongo1_data:
  watchlist_mongo2_data:
  review_mongo1_data:
  review_mongo2_data:
